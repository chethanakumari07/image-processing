<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Processing Service</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🖼️ Image Processing Service</h1>
    <!-- This button only shows once logged in — app.js toggles its visibility -->
    <button id="logoutBtn" class="hidden">Log out</button>
  </header>

  <!-- AUTH SCREEN  -->
  
  <section id="authSection">
    <div class="tabs">
      <button id="showLoginTab" class="tab active">Log In</button>
      <button id="showRegisterTab" class="tab">Sign Up</button>
    </div>

    <form id="loginForm" class="auth-form">
      <h2>Log In</h2>
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Log In</button>
      <p class="error" id="loginError"></p>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <h2>Sign Up</h2>
      <input type="text" id="registerUsername" placeholder="Username" required />
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input type="password" id="registerPassword" placeholder="Password (min 8 chars)" required />
      <button type="submit">Sign Up</button>
      <p class="error" id="registerError"></p>
    </form>
  </section>

  <!--  MAIN APP SCREEN  -->
  <section id="appSection" class="hidden">

    <div class="upload-box">
      <label for = "fileInput">Select an image</label>
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif"/>
      <button id="uploadBtn">Upload Image</button>
      <p class="error" id="uploadError"></p>
    </div>

    <h2>Your Images</h2>
    <!-- app.js fills this with one .image-card per uploaded image -->
    <div id="gallery" class="gallery"></div>

  </section>

  <!--  TRANSFORM MODAL  -->

  <div id="transformModal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModalBtn" class="close-btn">&times;</button>
      <h2>Transform Image</h2>

      <div class="transform-options">

        <label class="option-row">
          <input type="checkbox" id="optResize" />
          Resize to
          <input type="number" id="resizeWidth" placeholder="width" class="small-input" />
          ×
          <input type="number" id="resizeHeight" placeholder="height" class="small-input" />
        </label>

        <label class="option-row">
          <input type="checkbox" id="optRotate" />
          Rotate
          <input type="number" id="rotateAngle" placeholder="degrees" class="small-input" />
          °
        </label>

        <label class="option-row">
          <input type="checkbox" id="optFlip" />
          Flip (upside down)
        </label>

        <label class="option-row">
          <input type="checkbox" id="optMirror" />
          Mirror (left-right)
        </label>

        <label class="option-row">
          <input type="checkbox" id="optWatermark" />
          Watermark text:
          <input type="text" id="watermarkText" placeholder="© your name" class="text-input" />
        </label>

        <label class="option-row">
          <input type="checkbox" id="optFilter" />
          Filter:
          <select id="filterName">
            <option value="grayscale">Grayscale</option>
            <option value="sepia">Sepia</option>
            <option value="invert">Invert</option>
            <option value="warm">Warm</option>
            <option value="cool">cool</option>
          </select>
        </label>

        <label class="option-row">
          <input type="checkbox" id="optCompress" />
          Compress, quality
          <input type="number" id="compressQuality" placeholder="1-100" min="1" max="100" class="small-input" />
        </label>

        <label class="option-row">
          <input type="checkbox" id="optFormat" />
          Convert to format:
          <select id="formatValue">
            <option value="jpeg">JPEG</option>
            <option value="png">PNG</option>
            <option value="webp">WEBP</option>
            <option value="avif">AVIF</option>
          </select>
        </label>

      </div>

      <button id="applyTransformBtn">Apply Transformations</button>
      <p class="error" id="transformError"></p>
      <div id="transformResult"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
